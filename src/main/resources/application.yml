spring:
  application:
    name: helpdesk
  config:
    # Permite ler as variáveis do arquivo .env local (não versionado) sem exportá-las no terminal.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/helpdesk}
    username: ${DB_USERNAME:helpdesk}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50

  flyway:
    # db/dev-data contém dados fictícios para testes manuais; remova-o via FLYWAY_LOCATIONS se não quiser carregá-los.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/dev-data}

  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
